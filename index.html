<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Semilla - Pasión por el Fútbol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor principal de la interfaz del chatbot -->
  <main class="chat-container">
    
    <!-- Encabezado del Chatbot -->
    <header class="chat-header">
      <div class="avatar">⚽</div>
      <div class="header-info">
        <h1>Semilla</h1>
        <span class="status">El bot futbolero ⚽ 🔥</span>
      </div>
    </header>

    <!-- Área de chat (mensajes) -->
    <section class="area-de-chat" id="area-de-chat">
      <!-- Los mensajes se insertarán dinámicamente -->
    </section>

    <!-- Selección de opciones (botones de menú) -->
    <section class="seleccion-de-opciones" id="seleccion-de-opciones">
      <!-- Los botones de opciones se generarán dinámicamente -->
    </section>

    <!-- Ingreso de texto -->
    <section class="ingreso-de-texto" id="ingreso-de-texto">
      <form id="formulario-ingreso" autocomplete="off">
        <input 
          type="text" 
          id="campo-texto" 
          placeholder="Escribe tu respuesta..." 
          disabled
        >
        <button type="submit" id="boton-enviar" disabled>Enviar</button>
      </form>
      <span class="error-mensaje" id="error-mensaje"></span>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
